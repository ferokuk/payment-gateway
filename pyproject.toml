[project]
name = "payment-gateway"
version = "0.1.0"
description = "Payment gateway for merchants"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.136.1",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[tool.ruff]
line-length = 100
  target-version = "py313"
  src = ["src", "tests"]

  [tool.ruff.lint]
  select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
  ignore = ["S101"]  # assert в тестах ок

  [tool.ruff.lint.per-file-ignores]
  "tests/**" = ["S"]
  "alembic/**" = ["E501"]

  [tool.ruff.format]
  quote-style = "double"

  [tool.mypy]
  python_version = "3.13"
  strict = true
  plugins = ["pydantic.mypy"]
  exclude = ["alembic/versions/"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
