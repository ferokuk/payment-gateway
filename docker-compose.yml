services:
  database:
    image: postgres:17
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    container_name: payment_gateway_migrate
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy

  app:
    build: .
    container_name: payment_gateway_app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reconciler:
    build: .
    container_name: payment_gateway_reconciler
    restart: always
    env_file:
      - .env
    environment:
      # Callbacks of the auto provider must reach the API, and "localhost" here
      # is this container, which serves no HTTP.
      SELF_BASE_URL: http://app:8000
    command: ["python", "-m", "src.reconciler"]
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully


volumes:
  postgres_data:
